name: Validate official store
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.13" }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.x"
          cache: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - run: pip install check-jsonschema==0.33.3 PyYAML==6.0.2
      - run: check-jsonschema --schemafile schemas/store.schema.json store.yaml
      - run: find apps -name app.yaml -print0 | xargs -0 -n1 check-jsonschema --schemafile schemas/app.schema.json
      - name: Verify manifest hashes
        run: ./scripts/verify-hashes.sh
      - name: Verify OCI images and architectures
        run: python scripts/verify-images.py
      - name: Verify detached Ed25519 signature
        env: { GO111MODULE: "off" }
        run: go run scripts/verify-signature.go
