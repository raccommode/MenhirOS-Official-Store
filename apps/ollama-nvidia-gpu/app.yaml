schemaVersion: '1'
id: ollama-nvidia-gpu
name:
  en: Ollama(Nvidia GPU)
  fr: Ollama(Nvidia GPU)
description:
  en: Ollama is a tool for running large language models locally, designed to help users quickly deploy and manage AI models via a simple command-line interface and server. Its intuitive Web interface and efficient design make it ideal for developers, researchers, and AI enthusiasts working on local hardware. The tool's core features include local model execution and multi-model support. It enables running models like Llama 3, Mistral, and Gemma, with simple commands for downloading and switching models. All data…
  fr: Ollama est un outil pour exécuter des grands modèles de langage localement, conçu pour aider les utilisateurs à déployer et gérer rapidement des modèles IA via une interface en ligne de commande simple et un serveur. Son interface Web intuitive et sa conception efficace le rendent idéal pour les développeurs, chercheurs et passionnés d'IA travaillant sur du matériel local. Les fonctionnalités principales de l'outil incluent l'exécution de modèles locaux et le support multi-modèles. Il permet d'exécuter des…
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Ollama/icon.svg
version: 0.9.5
architectures:
- amd64
- arm64
containers:
- name: ollama
  image: ollama/ollama:0.9.5@sha256:64fcc2a7c48ae920f5317264031d86414e30417269631822858c6d23f61100b0
  ports:
  - container: 11434
    protocol: tcp
    proxy: true
  volumes:
  - name: appdata
    target: /root/.ollama
    type: app
resources:
  memoryMinimum: 2G
  memoryRecommended: 4G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /root/.ollama
migrations: []
releaseNotes:
  en: v0.9.5 updates the macOS and Windows applications. - Ollama can now be exposed on the network, and the model storage directory can be changed. - The macOS app is now native with a smaller footprint and faster startup, and fixes include CLI installation and notarization issues.
  fr: v0.9.5 met a jour les macOS et Windows applications. - Ollama peut maintenant etre expose sur le reseau et le model storage directory peut etre modifie. - La macOS app est maintenant native, plus legere et demarre plus vite; les problemes CLI installation et notarization issues sont corriges.
securityClassification: standard
