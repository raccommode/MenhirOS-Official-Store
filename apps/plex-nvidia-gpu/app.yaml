schemaVersion: '1'
id: plex-nvidia-gpu
name:
  en: Plex(Nvidia GPU)
  fr: Plex(Nvidia GPU)
description:
  en: Transform your home into a cinematic oasis with your very own media server. Unlike streaming platforms that compress and limit the quality of your content, a Plex server in your home allows you to maintain the pristine, high-bitrate glory of Blu-ray and beyond. Imagine pairing this high-fidelity, uninterrupted media access with cutting-edge home theater tech like VR headsets, 75-inch UHD TVs, or 100-inch laser projectors. The result? A breathtaking visual and auditory experience that streams seamlessly across TVs…
  fr: Application Plex(Nvidia GPU) auto-hébergée issue du catalogue officiel CasaOS.
version: 1.41.3
architectures:
- amd64
- arm64
containers:
- name: plex
  image: lscr.io/linuxserver/plex:1.41.3@sha256:ec54f85c19b3575c63929c260a0d8c360d57d41f3597ac9184cb134b6c634137
  environment:
    PGID: '1000'
    PUID: '1000'
    VERSION: docker
    CPU_FALLBACK: 'true'
    NVIDIA_VISIBLE_DEVICES: all
  volumes:
  - name: config
    target: /config
    type: app
  - name: media
    target: /Media
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: true
  capabilities: []
  devices:
  - /dev/dri
  - /dev/dvb
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - The configured image tag is linuxserver/plex:1.41.3. - LinuxServer also publishes a version-1.41.3.9314-a0bfb8370 tag for this Plex image line. - The GPU-enabled entry tracks the same LinuxServer container tag as the standard Plex entry.
  fr: '- Le tag d''image configuré est linuxserver/plex:1.41.3. - LinuxServer publie aussi un tag version-1.41.3.9314-a0bfb8370 pour cette ligne d''image Plex. - L''entrée compatible GPU suit le même tag de conteneur LinuxServer que l''entrée Plex standard.'
securityClassification: critical
