    target: /config
    type: app
resources:
  memoryMinimum: 512M
  memoryRecommended: 1G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for BOINC 8.2.8dfsg202512070716ubuntu24.04.1-ls128.
  fr: Intégration Menhir pour BOINC 8.2.8dfsg202512070716ubuntu24.04.1-ls128.
securityClassification: standard
