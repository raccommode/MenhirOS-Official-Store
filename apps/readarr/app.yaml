schemaVersion: '1'
id: readarr
name:
  en: Readarr
  fr: Readarr
description:
  en: Readarr is a ebook collection manager for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new books from your favorite authors and will interface with clients and indexers to grab, sort, and rename them.
  fr: Readarr est un gestionnaire de collection de livres électroniques pour les utilisateurs de Usenet et de BitTorrent. Il peut surveiller plusieurs flux RSS pour obtenir de nouveaux livres de vos auteurs préférés et interagira avec des clients et des indexeurs pour les obtenir, les trier et les renommer.
version: 0.3.10-develop
architectures:
- amd64
- arm64
containers:
- name: readarr
  image: linuxserver/readarr:0.3.10-develop@sha256:c39c1fe2e48e9353a2d81294d70b7624975ae8d603c3cae8df77583d3efeca5b
  environment:
    PGID: '1000'
    PUID: '1000'
    TZ: Etc/UTC
  ports:
  - container: 8787
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
  - name: books
    target: /books
    type: share
  - name: downloads
    target: /downloads
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Manifest synchronized with verified upstream metadata at revision e717df5e312d.
  fr: Manifeste synchronisé avec les métadonnées amont vérifiées à la révision e717df5e312d.
securityClassification: standard
