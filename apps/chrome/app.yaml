schemaVersion: '1'
id: chrome
name:
  en: Chrome
  fr: Chrome
description:
  en: '[Chrome] is the official web browser from Google, built to be fast, secure, and customizable.'
  fr: Application auto-hébergée de navigation web pour votre serveur Menhir.
icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/chrome-logo.png
version: 150.0.7871.186-1-ls110
architectures:
- amd64
- arm64
containers:
- name: chrome
  image: lscr.io/linuxserver/chrome:latest@sha256:d47dab4e22d76352ea5323be347b200b03e1791d3ab70b7c25c8a71ab6887251
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  - container: 3001
    protocol: tcp
    proxy: false
  volumes:
  - name: config
    target: /config
    type: app
resources:
  memoryMinimum: 1G
  memoryRecommended: 2G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for Chrome 150.0.7871.186-1-ls110.
  fr: Intégration Menhir pour Chrome 150.0.7871.186-1-ls110.
securityClassification: standard
