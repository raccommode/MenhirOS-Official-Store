schemaVersion: '1'
id: sure
name:
  en: Sure
  fr: Sure
description:
  en: 'Sure is a personal finance management application designed to help you track your expenses, income, and investments in one place. With an intuitive interface and powerful features, Sure makes it easy to understand your financial situation and make informed decisions about your money. Key Features: - Expense Tracking : Easily log and categorize your expenses - Income Management : Track multiple income sources - Investment Monitoring : Keep an eye on your investments and their performance - Budget Planning : Create…'
  fr: 'Sure est une application de gestion financière personnelle conçue pour vous aider à suivre vos dépenses, revenus et investissements en un seul endroit. Avec une interface intuitive et des fonctionnalités puissantes, Sure facilite la compréhension de votre situation financière et la prise de décisions éclairées concernant votre argent. Fonctionnalités Clés : - Suivi des Dépenses : Enregistrez et catégorisez facilement vos dépenses - Gestion des Revenus : Suivez plusieurs sources de revenus - Surveillance des…'
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Sure/icon.svg
version: 0.6.5-hotfix.1
architectures:
- amd64
- arm64
containers:
- name: sure-db
  image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  environment:
    POSTGRES_USER: sure_user
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: sure_production
  volumes:
  - name: pgdata
    target: /var/lib/postgresql/data
    type: app
  healthcheck:
    test:
    - CMD-SHELL
    - pg_isready -U sure_user -d sure_production
    interval: 5s
    timeout: 5s
    retries: 5
- name: sure-redis
  image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
  volumes:
  - name: data
    target: /data
    type: app
  healthcheck:
    test:
    - CMD
    - redis-cli
    - ping
    interval: 5s
    timeout: 5s
    retries: 5
- name: sure-web
  image: ghcr.io/we-promise/sure:0.6.5-hotfix.1@sha256:d6416171d5b0c13194fe2be9fa1d433f48c1783a8a4c7422ab6001a3ff0ea2af
  environment:
    POSTGRES_USER: sure_user
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: sure_production
    SECRET_KEY_BASE: ${secret:SECRET_KEY_BASE}
    SELF_HOSTED: 'true'
    RAILS_FORCE_SSL: 'false'
    RAILS_ASSUME_SSL: 'false'
    DB_HOST: sure-db
    DB_PORT: '5432'
    REDIS_URL: redis://sure-redis:6379/1
    OPENAI_ACCESS_TOKEN: ${secret:OPENAI_ACCESS_TOKEN}
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: storage
    target: /rails/storage
    type: app
- name: sure-worker
  image: ghcr.io/we-promise/sure:0.6.5-hotfix.1@sha256:d6416171d5b0c13194fe2be9fa1d433f48c1783a8a4c7422ab6001a3ff0ea2af
  command:
  - bundle
  - exec
  - sidekiq
  environment:
    POSTGRES_USER: sure_user
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: sure_production
    SECRET_KEY_BASE: ${secret:SECRET_KEY_BASE}
    SELF_HOSTED: 'true'
    RAILS_FORCE_SSL: 'false'
    RAILS_ASSUME_SSL: 'false'
    DB_HOST: sure-db
    DB_PORT: '5432'
    REDIS_URL: redis://sure-redis:6379/1
    OPENAI_ACCESS_TOKEN: ${secret:OPENAI_ACCESS_TOKEN}
  volumes:
  - name: storage
    target: /rails/storage
    type: app
resources:
  memoryMinimum: 4G
  memoryRecommended: 8G
  cpuRecommended: 2
secrets:
- name: OPENAI_ACCESS_TOKEN
  label:
    en: Openai Access Token
    fr: Openai Access Token
  description:
    en: Optional value used by sure.
    fr: Valeur facultative utilisée par sure.
  required: false
  generate: false
- name: POSTGRES_PASSWORD
  label:
    en: Postgres Password
    fr: Postgres Password
  description:
    en: Secret generated securely for sure.
    fr: Secret généré de façon sécurisée pour sure.
  required: true
  generate: true
- name: SECRET_KEY_BASE
  label:
    en: Secret Key Base
    fr: Secret Key Base
  description:
    en: Secret generated securely for sure.
    fr: Secret généré de façon sécurisée pour sure.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data
  - /rails/storage
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: v0.6.5-hotfix.1 fixes mobile drag and re-order behavior. - Simplefin liabilities recording was fixed.
  fr: v0.6.5-hotfix.1 corrige mobile drag et re-order behavior. - Simplefin liabilities recording a ete corrige.
securityClassification: sensitive
