migrations: []
releaseNotes:
  en: v13.0.1-security-01 ships Grafana 13.0.1 with security fixes. - Security fixes cover CVE-2026-28374, CVE-2026-28376, CVE-2026-28383, CVE-2026-28380, CVE-2026-33376, CVE-2026-28379, CVE-2026-33377, CVE-2026-33378, CVE-2026-33381, and CVE-2026-33380. - The grafana/grafana:13.0.1-security-01 Docker image tag was published on 2026-05-12.
  fr: v13.0.1-security-01 ships Grafana 13.0.1 with security fixes. - Security fixes cover CVE-2026-28374, CVE-2026-28376, CVE-2026-28383, CVE-2026-28380, CVE-2026-33376, CVE-2026-28379, CVE-2026-33377, CVE-2026-33378, CVE-2026-33381, and CVE-2026-33380. - The grafana/grafana:13.0.1-security-01 Docker image tag was published on 2026-05-12.
