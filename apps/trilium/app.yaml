schemaVersion: '1'
id: trilium
name:
  en: Trilium
  fr: Trilium
description:
  en: TriliumNext Notes is a cross-platform hierarchical note-taking tool focused on building large personal knowledge bases, offering robust organization and editing capabilities. Its intuitive interface and versatile features make it ideal for scholars, developers, and note-taking enthusiasts managing complex knowledge. The tool's core features include hierarchical note organization and rich editing. Users can arrange notes in an arbitrarily deep tree structure, with single notes clonable to multiple locations. It…
  fr: TriliumNext Notes est un outil de prise de notes hiérarchique multiplateforme axé sur la construction de grandes bases de connaissances personnelles, offrant des capacités robustes d'organisation et d'édition. Son interface intuitive et ses fonctionnalités polyvalentes le rendent idéal pour les universitaires, les développeurs et les passionnés de prise de notes gérant des connaissances complexes. Les fonctionnalités principales de l'outil incluent l'organisation hiérarchique des notes et l'édition riche. Les…
version: 0.103.0
architectures:
- amd64
- arm64
containers:
- name: trilium
  image: triliumnext/trilium:v0.103.0@sha256:8e6bc939a6d5dbeed42d1b5b155bc790b1c28ca3ac414382d04d626903c62081
  ports:
  - container: 8080
    protocol: tcp
    proxy: true
  volumes:
  - name: appdata
    target: /home/node/trilium-data
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /home/node/trilium-data
migrations: []
releaseNotes:
  en: TriliumNext v0.103.0 adds beta spreadsheet notes and expands anchors so they can be linked across notes and inserted with a slash command. - Back-end scripting removes deprecated api.axios and deprecates api.cheerio; use the documented alternatives before relying on those APIs. - Fixes cover save indicator behavior, table-of-contents refreshes, horizontal scrolling, mobile add-button snapping, note reordering reactions, and board URL quick edits.
  fr: TriliumNext v0.103.0 adds beta spreadsheet notes and expands anchors so they can be linked across notes and inserted with a slash command. - Back-end scripting removes deprecated api.axios and deprecates api.cheerio; use the documented alternatives before relying on those APIs. - Fixes cover save indicator behavior, table-of-contents refreshes, horizontal scrolling, mobile add-button snapping, note reordering reactions, and board URL quick edits.
securityClassification: standard
