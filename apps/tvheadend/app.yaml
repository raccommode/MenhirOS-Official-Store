schemaVersion: '1'
id: tvheadend
name:
  en: TVHeadend
  fr: TVHeadend
description:
  en: 'tvheadend works as a proxy server: is a TV streaming server and recorder for Linux, FreeBSD and Android supporting DVB-S, DVB-S2, DVB-C, DVB-T, ATSC, ISDB-T, IPTV, SAT>IP and HDHomeRun as input sources. Tvheadend offers the HTTP (VLC, MPlayer), HTSP (Kodi,…'
  fr: Application auto-hébergée de outils multimédias pour votre serveur Menhir.
version: fcd987f0-ls285
architectures:
- amd64
- arm64
containers:
- name: tvheadend
  image: lscr.io/linuxserver/tvheadend:latest@sha256:ccd9f055f0eb5c78c43b40397e35ff30a884a40389222ef04f2e33efecbd3067
  ports:
  - container: 9981
    protocol: tcp
    proxy: true
  - container: 9982
    protocol: tcp
    proxy: false
  volumes:
  - name: config
    target: /config
    type: app
  - name: recordings
    target: /recordings
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for TVHeadend fcd987f0-ls285.
  fr: Intégration Menhir pour TVHeadend fcd987f0-ls285.
securityClassification: standard
