schemaVersion: '1'
id: memos
name:
  en: Memos
  fr: Memos
description:
  en: Memos is a lightweight, open-source, self-hosted note-taking application that offers a secure and streamlined solution for users prioritizing privacy and data control. All notes are stored on the user’s own server, eliminating risks associated with third-party cloud services. Its minimalist Web interface supports Markdown syntax and tag-based organization, enabling effortless capture of ideas, personal knowledge management, or small-scale team collaboration. The open-source design ensures transparency, long-term…
  fr: Memos est une application de prise de notes légère, open-source et auto-hébergée qui offre une solution sécurisée et simplifiée pour les utilisateurs qui accordent la priorité à la confidentialité et au contrôle des données. Toutes les notes sont stockées sur le serveur de l'utilisateur, éliminant ainsi les risques associés aux services cloud tiers. Son interface Web minimaliste prend en charge la syntaxe Markdown et l'organisation basée sur des tags, permettant une capture sans effort des idées, une gestion de…
version: 0.28.0
architectures:
- amd64
- arm64
containers:
- name: memos
  image: neosmemo/memos:0.28.0@sha256:06066de94333c091ee67c2ad5dec5f15bf5f35b31498c90092f9915dd05e9f92
  environment:
    PGID: '1000'
    PUID: '1000'
    TZ: Etc/UTC
  ports:
  - container: 5230
    protocol: tcp
    proxy: true
  volumes:
  - name: memos
    target: /var/opt/memos
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /var/opt/memos
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v0.28.0 improves SSO account handling by linking external provider identities to local Memos users. - The release redesigns account and SSO management and adds memo created/updated time display controls. - Fixes include authorization hardening, legacy username auth flows, markdown mixed-list handling, list query overhead, and task checkbox state preservation.
  fr: '- v0.28.0 improves SSO account handling by linking external provider identities to local Memos users. - The release redesigns account and SSO management and adds memo created/updated time display controls. - Fixes include authorization hardening, legacy username auth flows, markdown mixed-list handling, list query overhead, and task checkbox state preservation.'
securityClassification: standard
