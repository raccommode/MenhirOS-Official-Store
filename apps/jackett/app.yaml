schemaVersion: '1'
id: jackett
name:
  en: Jackett
  fr: Jackett
description:
  en: 'jackett works as a proxy server: it translates queries from apps (Sonarr, SickRage, CouchPotato, Mylar, etc) into tracker-site-specific http queries, parses the html response, then sends results back to the requesting software. This allows for getting…'
  fr: Application auto-hébergée de indexation de contenus pour votre serveur Menhir.
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jackett/icon.svg
version: v0.24.2288-ls476
architectures:
- amd64
- arm64
containers:
- name: jackett
  image: lscr.io/linuxserver/jackett:latest@sha256:bb5adc1c83b7a6df036a946d7a860c2304439523c196047d9c5f2f024afa4754
  ports:
  - container: 9117
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
  - name: downloads
    target: /downloads
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for Jackett v0.24.2288-ls476.
  fr: Intégration Menhir pour Jackett v0.24.2288-ls476.
securityClassification: standard
