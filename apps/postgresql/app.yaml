schemaVersion: '1'
id: postgresql
name:
  en: PostgreSQL
  fr: PostgreSQL
description:
  en: PostgreSQL is a powerful, open source object-relational database system with over 35 years of active development that has earned it a strong reputation for reliability, feature robustness, and performance. PostgreSQL is a highly stable database backed by more than 20 years of development by the open-source community. PostgreSQL is used as a primary database for many web applications as well as mobile and analytics applications.
  fr: PostgreSQL est un puissant système de gestion de bases de données relationnelles open source qui bénéficie de plus de 35 ans de développement actif, lui conférant une solide réputation en termes de fiabilité, de robustesse des fonctionnalités et de performances. PostgreSQL est une base de données hautement stable, développée depuis plus de 20 ans par la communauté open source. PostgreSQL est utilisé comme base de données principale dans de nombreuses applications web, ainsi que dans des applications mobiles et…
version: 17.4.0
architectures:
- amd64
- arm64
containers:
- name: postgresql
  image: postgres:17.4@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
  environment:
    PUID: '1000'
    PGID: '1000'
    TZ: Etc/UTC
    POSTGRES_USER: ${secret:POSTGRES_PASSWORD}
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: ${secret:POSTGRES_PASSWORD}
  ports:
  - container: 5432
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /var/lib/postgresql/data
    type: app
resources:
  memoryMinimum: 2G
  memoryRecommended: 4G
  cpuRecommended: 2
secrets:
- name: POSTGRES_PASSWORD
  label:
    en: Postgres Password
    fr: Postgres Password
  description:
    en: Secret generated securely for postgresql.
    fr: Secret généré de façon sécurisée pour postgresql.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - PostgreSQL 17.4 fixes libpq quoting behavior after CVE-2025-1094 so length-limited strings are handled correctly. - The release also fixes a pg createsubscriber memory leak and a Meson build-system header detection issue.
  fr: '- PostgreSQL 17.4 corrige le comportement de citation de libpq apres CVE-2025-1094 afin que les chaines limitees en longueur soient traitees correctement. - Cette version corrige aussi une fuite memoire dans pg createsubscriber et un probleme de detection d''en-tetes dans le systeme de build Meson.'
securityClassification: standard
