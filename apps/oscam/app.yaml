schemaVersion: '1'
id: oscam
name:
  en: Oscam
  fr: Oscam
description:
  en: oscam is an Open Source Conditional Access Module software used for descrambling DVB transmissions using smart cards. It's both a server and a client.
  fr: Application auto-hébergée de outils multimédias pour votre serveur Menhir.
icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/oscam-logo.png
version: 11966-ls20
architectures:
- amd64
- arm64
containers:
- name: oscam
  image: lscr.io/linuxserver/oscam:latest@sha256:fcbc4740086167cf819cc094b43b00523507d064746171c9043070123723dfcc
  ports:
  - container: 8888
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for Oscam 11966-ls20.
  fr: Intégration Menhir pour Oscam 11966-ls20.
securityClassification: standard
