  environment:
    GID: '1000'
    PASSWORD: casaos
    TZ: Europe/Madrid
    UDI: '1000'
    USERNAME: casaos
  ports:
  - container: 80
    protocol: tcp
    proxy: true
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths: []
migrations: []
releaseNotes:
