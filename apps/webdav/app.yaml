schemaVersion: '1'
id: webdav
name:
  en: WebDAV
  fr: WebDAV
description:
  en: WebDAV is a web-based protocol that allows you to share and manage files over the internet, providing a collaborative environment for file editing and versioning.
  fr: WebDAV est un protocole basé sur le web qui vous permet de partager et de gérer des fichiers sur Internet, offrant un environnement collaboratif pour l'édition et le contrôle de version des fichiers.
version: 0.0.1
architectures:
- amd64
containers:
- name: webdav
  image: ugeek/webdav:amd64@sha256:5e2b55f5eb0e2335f82b8dfbb02d0b0a8939779a9358f8cc2010c8c1c34e3e56
  environment:
    GID: '1000'
    PASSWORD: ${secret:PASSWORD}
    TZ: Europe/Madrid
    UDI: '1000'
    USERNAME: ${secret:PASSWORD}
  ports:
  - container: 80
    protocol: tcp
    proxy: true
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets:
- name: PASSWORD
  label:
    en: Password
    fr: Password
  description:
    en: Secret generated securely for webdav.
    fr: Secret généré de façon sécurisée pour webdav.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths: []
migrations: []
releaseNotes:
  en: Manifest synchronized with verified upstream metadata at revision e717df5e312d.
  fr: Manifeste synchronisé avec les métadonnées amont vérifiées à la révision e717df5e312d.
securityClassification: standard
