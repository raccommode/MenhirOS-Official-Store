schemaVersion: '1'
id: freshrss
name:
  en: FreshRSS
  fr: FreshRSS
description:
  en: freshrss is a free, self-hostable aggregator for rss feeds.
  fr: Application auto-hébergée de lecture de flux RSS pour votre serveur Menhir.
version: 1.29.1-ls315
architectures:
- amd64
- arm64
containers:
- name: freshrss
  image: lscr.io/linuxserver/freshrss:latest@sha256:1325365f3b9002d76251aef82505ce0e56c00ecc2790ce351b2fb1cc858a4278
  ports:
  - container: 80
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for FreshRSS 1.29.1-ls315.
  fr: Intégration Menhir pour FreshRSS 1.29.1-ls315.
securityClassification: standard
