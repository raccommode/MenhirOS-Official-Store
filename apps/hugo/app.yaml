schemaVersion: '1'
id: hugo
name:
  en: Hugo
  fr: Hugo
description:
  en: Hugo is a high-speed static site generation platform written in Go, optimized for speed and designed for flexibility. Advanced templating system and fast asset pipelines render a complete website in seconds, ideal for creating documentation sites, landing pages, and various project websites. Core features include optimized speed and a flexible framework. Concurrency in Go enables rapid rendering, supporting image processing (convert, resize, crop, rotate, adjust colors, apply filters, overlay text/images, extract…
  fr: Hugo est une plateforme de génération de sites statiques haute vitesse écrite en Go, optimisée pour la vitesse et conçue pour la flexibilité. Le système de templates avancé et les pipelines d'assets rapides rendent un site web complet en quelques secondes, idéal pour créer des sites de documentation, des pages d'atterrissage et divers sites web de projets. Les fonctionnalités principales incluent une vitesse optimisée et un framework flexible. La concurrence en Go permet un rendu rapide, supportant le traitement…
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Hugo/icon.svg
version: 0.161.1
architectures:
- amd64
- arm64
containers:
- name: hugo
  image: ghcr.io/gohugoio/hugo:v0.161.1@sha256:cef5b132b220dd5a661787d410124afe807b0ed3a79829604bdf0c3eefb85488
  command:
  - server
  - --bind=0.0.0.0
  ports:
  - container: 1313
    protocol: tcp
    proxy: true
  volumes:
  - name: project
    target: /project
    type: app
  - name: cache
    target: /cache
    type: cache
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /project
migrations: []
releaseNotes:
  en: v0.161.1 honors Retry-After headers in resources.GetRemote retries. - It adds AllowChildProcess to security.node.permissions and restricts the default http.urls @ deny rule to userinfo. - The ghcr.io/gohugoio/hugo:v0.161.1 Docker image tag was verified on GHCR.
  fr: v0.161.1 honors Retry-After headers in resources.GetRemote retries. - It adds AllowChildProcess to security.node.permissions and restricts the default http.urls @ deny rule to userinfo. - The ghcr.io/gohugoio/hugo:v0.161.1 Docker image tag was verified on GHCR.
securityClassification: standard
