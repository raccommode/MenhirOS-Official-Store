schemaVersion: '1'
id: mongodb-4
name:
  en: MongoDB 4
  fr: MongoDB 4
description:
  en: MongoDB is a free and open-source cross-platform document-oriented database program. Classified as a NoSQL database program, MongoDB uses JSON-like documents with schemata. MongoDB is developed by MongoDB Inc., and is published under a combination of the Server Side Public License and the Apache License.
  fr: MongoDB est un programme de base de données orienté documents, gratuit et open source, multiplateforme. MongoDB est classé comme un programme de base de données NoSQL et utilise des documents de type JSON avec des schémas. MongoDB est développé par MongoDB Inc. et est publié sous une combinaison de la Licence Publique du Côté Serveur et de la Licence Apache.
version: 4.4.22
architectures:
- amd64
- arm64
containers:
- name: mongodb4
  image: mongo:4.4.22@sha256:dcef38a5b82ca7e1293055ededc22d38fb27fffb526523c70a4cbd864182c310
  environment:
    PUID: '1000'
    PGID: '1000'
    TZ: Etc/UTC
  ports:
  - container: 27017
    protocol: tcp
    proxy: true
  volumes:
  - name: configdb
    target: /data/configdb
    type: app
  - name: db
    target: /data/db
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data/configdb
  - /data/db
migrations: []
releaseNotes:
  en: MongoDB 4.4.22 is a production release with fixes since 4.4.21 and is recommended for MongoDB 4.4 users. - Fixes include incremental backup handling where modified blocks could be omitted.
  fr: MongoDB 4.4.22 est une version de production avec des correctifs depuis 4.4.21 et elle est recommandee aux utilisateurs de MongoDB 4.4. - Les correctifs incluent le traitement des sauvegardes incrementales, ou des blocs modifies pouvaient etre omis.
securityClassification: standard
