schemaVersion: '1'
id: vocechat
name:
  en: VoceChat
  fr: VoceChat
description:
  en: VoceChat is a secure chat software designed for independent deployment, offering a flexible solution for seamless communication. It combines instant messaging with channel-based group chats, allowing you to engage in one-on-one conversations or create themed channels for group discussions. VoceChat supports a variety of message formats, including text, images, files, emojis, and rich text (Markdown), making your communication vibrant and expressive. Once deployed, it can be accessed via a WebAPP or mobile APP,…
  fr: VoceChat est un logiciel de chat sécurisé conçu pour un déploiement indépendant, offrant une solution flexible pour une communication fluide. Il combine la messagerie instantanée avec des discussions de groupe basées sur des canaux, permettant des conversations individuelles ou la création de canaux thématiques pour des discussions de groupe. VoceChat prend en charge une variété de formats de messages, y compris le texte, les images, les fichiers, les emojis et le texte enrichi (Markdown), rendant votre…
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/VoceChat/icon.svg
version: 0.5.17
architectures:
- amd64
containers:
- name: vocechat
  image: privoce/vocechat-server:v0.5.17@sha256:7df8b76b15e285c4e348ec44a855c0429bcea477928cfc857c5c42d22fc1d2d1
  environment:
    TZ: Etc/UTC
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /home/vocechat-server/data
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /home/vocechat-server/data
migrations: []
releaseNotes:
  en: VoceChat image v0.5.17 is available on Docker Hub for amd64. - The Privoce/vocechat-server-rust GitHub repository still only exposes tags through v0.3.20, so this update is based on the published Docker image tag.
  fr: VoceChat image v0.5.17 is available on Docker Hub for amd64. - The Privoce/vocechat-server-rust GitHub repository still only exposes tags through v0.3.20, so this update is based on the published Docker image tag.
securityClassification: standard
