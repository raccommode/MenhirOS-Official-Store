schemaVersion: '1'
id: 2fauth
name:
  en: 2FAuth
  fr: 2FAuth
description:
  en: 2FAuth is a web based self-hosted alternative to One Time Passcode (OTP) generators like Google Authenticator, designed for both mobile and desktop.
  fr: 2FAuth est une alternative auto-hébergée basée sur le web aux générateurs de codes à usage unique (OTP) tels que Google Authenticator, conçus pour les appareils mobiles et de bureau.
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/2FAuth/icon.svg
version: 6.1.3
architectures:
- amd64
- arm64
containers:
- name: 2fauth
  image: 2fauth/2fauth:6.1.3@sha256:0b2e2ea74f06ccddbc32b28495adfc92c8f5535cec1b3141dca95ee7c3c5189f
  environment:
    APP_KEY: SomeRandomStringOf32CharsExactly
  ports:
  - container: 8000
    protocol: tcp
    proxy: true
  volumes:
  - name: appdata
    target: /2fauth
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /2fauth
migrations: []
releaseNotes:
  en: v6.1.3 fixes the Try my luck feature being grayed out. - It also fixes minor UI glitches.
  fr: v6.1.3 fixes the Try my luck feature being grayed out. - It also fixes minor UI glitches.
securityClassification: standard
