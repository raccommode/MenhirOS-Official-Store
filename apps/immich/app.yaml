schemaVersion: '1'
id: immich
name:
  en: Immich
  fr: Immich
description:
  en: 'Immich: Revolutionizing Your Home Media Experience Immich is here to transform the way you manage and enjoy your media files across your home TV, smartphones, and other devices. Unlike traditional photo albums or mainstream cloud services, immich offers a seamless and modern platform for organizing, sharing, and accessing your photos and videos. Imagine effortlessly backing up your precious moments from your mobile devices and viewing them instantly on your TV or sharing them with family members—immich makes it…'
  fr: 'Immich : Révolutionnez votre expérience multimédia à domicile Immich est là pour transformer la façon dont vous gérez et profitez de vos fichiers multimédias sur votre télévision, smartphones et autres appareils. Contrairement aux albums photo traditionnels ou aux services cloud grand public, immich offre une plateforme moderne et fluide pour organiser, partager et accéder à vos photos et vidéos. Imaginez sauvegarder sans effort vos précieux moments depuis vos appareils mobiles et les visualiser instantanément…'
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Immich/icon.svg
version: 2.7.2
architectures:
- amd64
- arm64
containers:
- name: redis
  image: docker.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
  healthcheck:
    test:
    - CMD-SHELL
    - redis-cli ping || exit 1
    interval: 30s
    timeout: 10s
    retries: 3
- name: database
  image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
  environment:
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_USER: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: immich
    POSTGRES_INITDB_ARGS: --data-checksums
  volumes:
  - name: pgdata
    target: /var/lib/postgresql/data
    type: app
- name: immich-server
  image: ghcr.io/immich-app/immich-server:v2.7.2@sha256:6a2952539e2a9c8adcf6fb74850bb1ba7e1db2804050acea21baafdc9154c430
  environment:
    DB_DATABASE_NAME: immich
    DB_PASSWORD: ${secret:POSTGRES_PASSWORD}
    DB_USERNAME: ${secret:POSTGRES_PASSWORD}
  ports:
  - container: 2283
    protocol: tcp
    proxy: true
  volumes:
  - name: immich
    target: /usr/src/app/upload
    type: share
- name: immich-machine-learning
  image: ghcr.io/immich-app/immich-machine-learning:v2.7.2@sha256:2f381909ca2b669f22bf872ee0bea6b7d16dfce109431647a8cad0f2571ff053
  environment:
    DB_DATABASE_NAME: immich
    DB_PASSWORD: ${secret:POSTGRES_PASSWORD}
    DB_USERNAME: ${secret:POSTGRES_PASSWORD}
  volumes:
  - name: model-cache
    target: /cache
    type: cache
resources:
  memoryMinimum: 1G
  memoryRecommended: 2G
  cpuRecommended: 2
secrets:
- name: POSTGRES_PASSWORD
  label:
    en: Postgres Password
    fr: Postgres Password
  description:
    en: Secret generated securely for immich.
    fr: Secret généré de façon sécurisée pour immich.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: v2.7.2 fixes the default helmet.json file handling. - Machine-learning containers were fixed for some older CPUs by downgrading numpy. - External library import batch sizing was corrected.
  fr: v2.7.2 corrige la gestion du fichier helmet.json par defaut. - Les machine-learning containers ont ete corriges pour certains anciens CPU en retrogradant numpy. - External library import batch sizing a ete corrige.
securityClassification: standard
