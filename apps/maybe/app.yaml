schemaVersion: '1'
id: maybe
name:
  en: Maybe
  fr: Maybe
description:
  en: 'Maybe is a personal finance management application designed to help you track your expenses, income, and investments in one place. With an intuitive interface and powerful features, Maybe makes it easy to understand your financial situation and make informed decisions about your money. Key Features: - Expense Tracking : Easily log and categorize your expenses - Income Management : Track multiple income sources - Investment Monitoring : Keep an eye on your investments and their performance - Budget Planning :…'
  fr: 'Maybe est une application de gestion financière personnelle conçue pour vous aider à suivre vos dépenses, revenus et investissements en un seul endroit. Avec une interface intuitive et des fonctionnalités puissantes, Maybe facilite la compréhension de votre situation financière et la prise de décisions éclairées concernant votre argent. Fonctionnalités Clés : - Suivi des Dépenses : Enregistrez et catégorisez facilement vos dépenses - Gestion des Revenus : Suivez plusieurs sources de revenus - Surveillance des…'
version: 0.6.0
architectures:
- amd64
- arm64
containers:
- name: maybe-db
  image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  environment:
    POSTGRES_USER: maybe_user
    POSTGRES_PASSWORD: maybe_password
    POSTGRES_DB: maybe_production
  volumes:
  - name: pgdata
    target: /var/lib/postgresql/data
    type: app
  healthcheck:
    test:
    - CMD-SHELL
    - pg_isready -U maybe_user -d maybe_production
    interval: 5s
    timeout: 5s
    retries: 5
- name: maybe-redis
  image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
  volumes:
  - name: data
    target: /data
    type: app
  healthcheck:
    test:
    - CMD
    - redis-cli
    - ping
    interval: 5s
    timeout: 5s
    retries: 5
- name: maybe-web
  image: ghcr.io/maybe-finance/maybe:latest@sha256:c2d398bfc334db4d9862f268401dbb46f97848eaaaad8295d1221f2d99d631cc
  environment:
    POSTGRES_USER: maybe_user
    POSTGRES_PASSWORD: maybe_password
    POSTGRES_DB: maybe_production
    SECRET_KEY_BASE: a7523c3d0ae56415046ad8abae168d71074a79534a7062258f8d1d51ac2f76d3c3bc86d86b6b0b307df30d9a6a90a2066a3fa9e67c5e6f374dbd7dd4e0778e13
    SELF_HOSTED: 'true'
    RAILS_FORCE_SSL: 'false'
    RAILS_ASSUME_SSL: 'false'
    DB_HOST: maybe-db
    DB_PORT: '5432'
    REDIS_URL: redis://maybe-redis:6379/1
    OPENAI_ACCESS_TOKEN: ${secret:OPENAI_ACCESS_TOKEN}
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: storage
    target: /rails/storage
    type: app
- name: maybe-worker
  image: ghcr.io/maybe-finance/maybe:latest@sha256:c2d398bfc334db4d9862f268401dbb46f97848eaaaad8295d1221f2d99d631cc
  command:
  - bundle
  - exec
  - sidekiq
  environment:
    POSTGRES_USER: maybe_user
    POSTGRES_PASSWORD: maybe_password
    POSTGRES_DB: maybe_production
    SECRET_KEY_BASE: a7523c3d0ae56415046ad8abae168d71074a79534a7062258f8d1d51ac2f76d3c3bc86d86b6b0b307df30d9a6a90a2066a3fa9e67c5e6f374dbd7dd4e0778e13
    SELF_HOSTED: 'true'
    RAILS_FORCE_SSL: 'false'
    RAILS_ASSUME_SSL: 'false'
    DB_HOST: maybe-db
    DB_PORT: '5432'
    REDIS_URL: redis://maybe-redis:6379/1
    OPENAI_ACCESS_TOKEN: ${secret:OPENAI_ACCESS_TOKEN}
resources:
  memoryMinimum: 4G
  memoryRecommended: 8G
  cpuRecommended: 2
secrets:
- name: OPENAI_ACCESS_TOKEN
  label:
    en: Openai Access Token
    fr: Openai Access Token
  description:
    en: Optional value used by maybe.
    fr: Valeur facultative utilisée par maybe.
  required: false
  generate: false
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data
  - /rails/storage
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog at revision e717df5e312d.
  fr: Importation depuis le catalogue officiel CasaOS à la révision e717df5e312d.
securityClassification: sensitive
