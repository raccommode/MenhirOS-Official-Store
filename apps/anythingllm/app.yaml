schemaVersion: '1'
id: anythingllm
name:
  en: AnythingLLM
  fr: AnythingLLM
description:
  en: AnythingLLM is the easiest to use, all-in-one AI application that can do RAG, AI Agents, and much more with no code or infrastructure headaches.
  fr: Application AnythingLLM auto-hébergée issue du catalogue officiel CasaOS.
version: 1.14.2
architectures:
- amd64
containers:
- name: anythingllm
  image: mintplexlabs/anythingllm@sha256:5a516f66245b5a4e4c3024dfd90a95b55dcb13fa18e9a5eb73a5a65293a5c686
  environment:
    STORAGE_DIR: /app/server/storage
  ports:
  - container: 3001
    protocol: tcp
    proxy: true
  volumes:
  - name: storage
    target: /app/server/storage
    type: app
resources:
  memoryMinimum: 1G
  memoryRecommended: 2G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities:
  - SYS_ADMIN
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /app/server/storage
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - Latest upstream release v1.12.1 adds streamed document embedding status so workspace uploads report progress per document. - Built-in Agent skill integrations were added for Gmail, Outlook, and Google Calendar. - Other improvements include image lightbox support, Korean/Chinese/Japanese PDF generation support, better integration citations, and DDG default web search for agent skills.
  fr: '- La derniere release upstream v1.12.1 ajoute l''etat de document embedding en streaming, avec une progression par document lors des uploads dans le workspace. - Des integrations Agent skill integrees ont ete ajoutees pour Gmail, Outlook et Google Calendar. - Les autres ameliorations incluent image lightbox, la prise en charge coreen/chinois/japonais pour la generation PDF, de meilleures citations d''integration et DDG comme recherche web par defaut pour les agent skills.'
securityClassification: critical
