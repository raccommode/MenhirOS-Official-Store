schemaVersion: '1'
id: ddns-updater
name:
  en: ddns-updater
  fr: ddns-updater
description:
  en: Program to keep DNS A and/or AAAA records updated for multiple DNS providers
  fr: Application ddns-updater auto-hébergée issue du catalogue officiel CasaOS.
version: 2.10.0
architectures:
- amd64
- arm64
containers:
- name: ddns-updater
  image: qmcgaw/ddns-updater:v2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
  command:
  - touch /data/config.json
  environment:
    BACKUP_DIRECTORY: /updater/data
    BACKUP_PERIOD: '0'
    CONFIG: ''
    HTTP_TIMEOUT: 10s
    LISTENING_ADDRESS: :8000
    LOG_CALLER: hidden
    LOG_LEVEL: info
    PERIOD: 5m
    PUBLICIP_DNS_PROVIDERS: all
    PUBLICIP_DNS_TIMEOUT: 3s
    PUBLICIP_FETCHERS: all
    PUBLICIP_HTTP_PROVIDERS: all
    PUBLICIPV4_HTTP_PROVIDERS: all
    PUBLICIPV6_HTTP_PROVIDERS: all
    ROOT_URL: /
    SHOUTRRR_ADDRESSES: ''
    UPDATE_COOLDOWN_PERIOD: 5m
  ports:
  - container: 8000
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /updater/data
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /updater/data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v2.10.0 adds provider support for Scaleway, IPv64, Vercel, Hetzner Cloud, and Spaceship. - It fixes DNS resolution hangs, Route53 wildcard updates, Ionos URL paths, DonDominio key naming, deSEC IP-version updates, and Njalla paths. - Documentation and dependency updates are included.
  fr: '- v2.10.0 adds provider support for Scaleway, IPv64, Vercel, Hetzner Cloud, and Spaceship. - It fixes DNS resolution hangs, Route53 wildcard updates, Ionos URL paths, DonDominio key naming, deSEC IP-version updates, and Njalla paths. - Documentation and dependency updates are included.'
securityClassification: standard
