schemaVersion: '1'
id: karakeep
name:
  en: Karakeep
  fr: Karakeep
description:
  en: 'Karakeep is an open-source, self-hosted bookmark manager for links, notes, images, PDFs, and highlights, built to keep everything you want to save in one place. It automatically fetches titles, descriptions, and previews, then helps you organize your library with AI tagging, full-text search, lists, and rule-based automation. With browser extensions, mobile apps, RSS ingestion, and page archiving, Karakeep works well as both a read-later tool and a durable personal content archive. Main Features: - Save links,…'
  fr: Karakeep est un gestionnaire de favoris open-source et auto-hébergé pour les liens, notes, images, PDF et surlignages, conçu pour réunir en un seul endroit tout ce que vous voulez conserver. Il récupère automatiquement les titres, descriptions et aperçus, puis vous aide à organiser votre bibliothèque avec le marquage par IA, la recherche plein texte, les listes et l'automatisation basée sur des règles. Avec des extensions de navigateur, des applications mobiles, l'ingestion RSS et l'archivage complet des pages,…
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Karakeep/icon.svg
version: 0.32.0
architectures:
- amd64
- arm64
containers:
- name: karakeep
  image: ghcr.io/karakeep-app/karakeep:0.32.0@sha256:64d6a9bbf2d37b5c808cf06b5d87f1f1c7846fdd3844724145a9741aeb06fd31
  environment:
    MEILI_ADDR: http://karakeep-meilisearch:7700
    BROWSER_WEB_URL: http://karakeep-chrome:9222
    DATA_DIR: /data
    NEXTAUTH_URL: http://localhost:14592
    NEXTAUTH_SECRET: ${secret:NEXTAUTH_SECRET}
    MEILI_MASTER_KEY: ${secret:NEXTAUTH_SECRET}
    OPENAI_API_KEY: ''
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /data
    type: app
- name: karakeep-chrome
  image: gcr.io/zenika-hub/alpine-chrome:124@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
  command:
  - --no-sandbox
  - --disable-gpu
  - --disable-dev-shm-usage
  - --remote-debugging-address=0.0.0.0
  - --remote-debugging-port=9222
  - --hide-scrollbars
- name: karakeep-meilisearch
  image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
  environment:
    MEILI_MASTER_KEY: ${secret:NEXTAUTH_SECRET}
    MEILI_NO_ANALYTICS: 'true'
  volumes:
  - name: meilisearch
    target: /meili_data
    type: app
resources:
  memoryMinimum: 1280M
  memoryRecommended: 2560M
  cpuRecommended: 2
secrets:
- name: NEXTAUTH_SECRET
  label:
    en: Nextauth Secret
    fr: Nextauth Secret
  description:
    en: Secret generated securely for karakeep.
    fr: Secret généré de façon sécurisée pour karakeep.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data
  - /meili_data
migrations: []
releaseNotes:
  en: v0.32.0 updates the default Meilisearch version to 1.41.0 and improves the Docker Compose development environment. - It improves self-hosted operation with granular API key scopes, CLI authentication config storage, new MCP/API capabilities, event logging, and rule engine enhancements. - It includes server-side security fixes for SSRF, rate limiting, stored XSS, and password reset tokens, plus crawler, import, search, and Meilisearch batching fixes.
  fr: La v0.32.0 met à jour la version Meilisearch par défaut vers 1.41.0 et améliore l'environnement de développement Docker Compose. - Elle améliore l'exploitation auto-hébergée avec des scopes granulaires pour les clés API, le stockage de la configuration d'auth CLI, de nouvelles capacités MCP/API, l'event logging et des améliorations du moteur de règles. - Elle inclut des correctifs de sécurité côté serveur pour SSRF, rate limiting, XSS stocké et jetons de réinitialisation de mot de passe, ainsi que des…
securityClassification: standard
