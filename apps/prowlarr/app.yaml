schemaVersion: '1'
id: prowlarr
name:
  en: Prowlarr
  fr: Prowlarr
description:
  en: prowlarr is a indexer manager/proxy built on the popular arr .net/reactjs base stack to integrate with your various PVR apps. Prowlarr supports both Torrent Trackers and Usenet Indexers. It integrates seamlessly with Sonarr, Radarr, Lidarr, and Readarr…
  fr: Application auto-hébergée de indexation de contenus pour votre serveur Menhir.
version: 2.5.2.5491-ls155
architectures:
- amd64
- arm64
containers:
- name: prowlarr
  image: lscr.io/linuxserver/prowlarr:latest@sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
  ports:
  - container: 9696
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for Prowlarr 2.5.2.5491-ls155.
  fr: Intégration Menhir pour Prowlarr 2.5.2.5491-ls155.
securityClassification: standard
