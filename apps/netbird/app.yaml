  hostNetwork: true
  capabilities:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RESOURCE
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /var/lib/netbird
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v0.62.3 adds management-side config compatibility checks. - The official changelog points to the full v0.62.2...v0.62.3 comparison.
  fr: '- v0.62.3 ajoute des vérifications de compatibilité de configuration côté management. - Le changelog officiel renvoie à la comparaison complète v0.62.2...v0.62.3.'
