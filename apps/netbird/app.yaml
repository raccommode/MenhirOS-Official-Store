schemaVersion: '1'
id: netbird
name:
  en: NetBird
  fr: NetBird
description:
  en: NetBird combines a WireGuard®-based overlay network with Zero Trust Network Access, providing a unified open source platform for reliable and secure connectivity. - Secure Remote Access – Enable least privilege network access in a few clicks - Zero-Config Deployment – Replace legacy VPNs with a peer-to-peer WireGuard®-based network - Seamless SSO with MFA – Secure your network access with session-based SSO & MFA - Dynamic Posture Checks – Grant access only to devices meeting your security rules - Centralized…
  fr: Application NetBird auto-hébergée issue du catalogue officiel CasaOS.
version: 0.62.3
architectures:
- amd64
- arm64
containers:
- name: netbird
  image: netbirdio/netbird:0.62.3@sha256:bfacc59e319ae6614975218a11cf46f540f8ddb96c8aaaa341c5c2b6b470f862
  environment:
    NB_SETUP_KEY: ''
    NB_MANAGEMENT_URL: ''
    NB_HOSTNAME: Zima
    NB_ENABLE_SSH_ROOT: 'true'
    NB_ALLOW_SERVER_SSH: 'true'
  volumes:
  - name: appdata
    target: /var/lib/netbird
    type: app
resources:
