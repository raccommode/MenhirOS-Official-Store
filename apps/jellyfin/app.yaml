schemaVersion: '1'
id: jellyfin
name:
  en: Jellyfin
  fr: Jellyfin
description:
  en: Free media system for organizing and streaming your library.
  fr: Système multimédia libre pour organiser et diffuser votre bibliothèque.
version: 10.11.11
architectures:
- amd64
- arm64
containers:
- name: jellyfin
  image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
  ports:
  - container: 8096
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
  - name: cache
    target: /cache
    type: cache
  - name: media
    target: /media
    type: share
  healthcheck:
    test:
    - CMD
    - curl
    - -f
    - http://localhost:8096/health
    interval: 30s
    timeout: 10s
    retries: 5
resources:
  memoryMinimum: 512M
  memoryRecommended: 2G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: consistent
  paths:
  - /config
  preSnapshot:
  - menhir container stop --timeout 30 jellyfin
  postSnapshot:
  - menhir container start jellyfin
  restore:
  - menhir container start jellyfin
migrations: []
releaseNotes:
  en: Initial Menhir integration for Jellyfin 10.11.11.
  fr: Intégration Menhir initiale de Jellyfin 10.11.11.
securityClassification: standard
