schemaVersion: '1'
id: convertx
name:
  en: ConvertX
  fr: ConvertX
description:
  en: ConvertX is a self-hosted file conversion service that allows users to convert files between different formats through an intuitive web interface. It supports a wide range of file types including documents, images, videos, and audio files, making it a comprehensive solution for all your file conversion needs. The service is designed with simplicity and ease of use in mind. Users can simply upload their files, select the desired output format, and let ConvertX handle the conversion process. The web interface…
  fr: ConvertX est un service de conversion de fichiers auto-hébergé qui permet aux utilisateurs de convertir des fichiers entre différents formats via une interface web intuitive. Il prend en charge une large gamme de types de fichiers, y compris les documents, les images, les vidéos et les fichiers audio, en faisant une solution complète pour tous vos besoins de conversion de fichiers. Le service est conçu en pensant à la simplicité et à la facilité d'utilisation. Les utilisateurs peuvent simplement télécharger leurs…
version: 0.17.0
architectures:
- amd64
- arm64
containers:
- name: convertx
  image: c4illin/convertx:v0.17.0@sha256:e1f85be04bbaf8a55ead9261194c3ae0fa0957d303ea537127154860b2552afd
  environment:
    JWT_SECRET: ${secret:JWT_SECRET}
    HTTP_ALLOWED: 'true'
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /app/data
    type: app
resources:
  memoryMinimum: 500M
  memoryRecommended: 1000M
  cpuRecommended: 1
secrets:
- name: JWT_SECRET
  label:
    en: Jwt Secret
    fr: Jwt Secret
  description:
    en: Secret generated securely for convertx.
    fr: Secret généré de façon sécurisée pour convertx.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /app/data
migrations: []
releaseNotes:
  en: v0.17.0 adds VCF to CSV conversion and a multi-select bulk job deletion UI. - It adds markitdown-based conversion support. - Fixes include WMA input handling, timezone display in history, and Docker support for Inkscape DXF export.
  fr: v0.17.0 adds VCF to CSV conversion and a multi-select bulk job deletion UI. - It adds markitdown-based conversion support. - Fixes include WMA input handling, timezone display in history, and Docker support for Inkscape DXF export.
securityClassification: standard
