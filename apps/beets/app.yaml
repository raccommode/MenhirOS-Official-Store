schemaVersion: '1'
id: beets
name:
  en: Beets
  fr: Beets
description:
  en: beets is a music library manager and not, for the most part, a music player. It does include a simple player plugin and an experimental Web-based player, but it generally leaves actual sound-reproduction to specialized tools.
  fr: Application auto-hébergée de musique et audio pour votre serveur Menhir.
version: 2.13.0-ls343
architectures:
- amd64
- arm64
containers:
- name: beets
  image: lscr.io/linuxserver/beets:latest@sha256:59f5abbd5ea617aae2b055d365dddf0f8fef2c5ca3ee0e96ef26e22bc648d3b7
  ports:
  - container: 8337
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
  - name: music
    target: /music
    type: share
  - name: downloads
    target: /downloads
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Menhir integration for Beets 2.13.0-ls343.
  fr: Intégration Menhir pour Beets 2.13.0-ls343.
securityClassification: standard
