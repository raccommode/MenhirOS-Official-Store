schemaVersion: '1'
id: pinchflat
name:
  en: Pinchflat
  fr: Pinchflat
description:
  en: 'Pinchflat is a self-hosted app for downloading YouTube content built using yt-dlp. It''s designed to be lightweight, self-contained, and easy to use. You set up rules for how to download content from YouTube channels or playlists and it''ll do the rest, periodically checking for new content. Key features include: - Self-contained - just one Docker container with no external dependencies - Powerful naming system so content is stored where and how you want it - Easy-to-use web interface with presets to get you…'
  fr: 'Pinchflat est une application auto-hébergée pour télécharger du contenu YouTube construite avec yt-dlp. Elle est conçue pour être légère, autonome et facile à utiliser. Vous configurez des règles pour télécharger du contenu depuis des chaînes ou playlists YouTube et elle fait le reste, vérifiant périodiquement le nouveau contenu. Les fonctionnalités clés incluent : - Autonome - juste un conteneur Docker sans dépendances externes - Système de nommage puissant pour que le contenu soit stocké où et comme vous le…'
version: 2025.9.26
architectures:
- amd64
containers:
- name: pinchflat
  image: ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
  environment:
    TZ: Etc/UTC
    PUID: '1000'
    PGID: '1000'
  ports:
  - container: 8945
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
  - name: downloads
    target: /downloads
    type: share
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: Latest upstream release v2025.9.26 includes an important note referencing upstream issue 800. - Dockerfiles now include Deno.
  fr: La derniere release upstream v2025.9.26 inclut une note importante renvoyant a l'issue upstream 800. - Les Dockerfiles incluent maintenant Deno.
securityClassification: standard
