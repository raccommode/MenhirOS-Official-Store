schemaVersion: '1'
id: node-red
name:
  en: Node-RED
  fr: Node-RED
description:
  en: Node-RED is a flow-based low-code development platform that enables creating automation tasks and applications by connecting various nodes. A browser-based editor, simple to use, makes it ideal for users in home automation, industrial control, or other fields to quickly build data processing flows. Core features include a low-code flow editor and robust data handling. Built on Node.js with an event-driven, non-blocking model, the platform supports real-time data collection, transformation, and visualization. A…
  fr: Node-RED est une plateforme de développement low-code basée sur les flux qui permet de créer des tâches d'automatisation et des applications en connectant divers nœuds. Un éditeur basé sur navigateur, simple à utiliser, le rend idéal pour les utilisateurs dans l'automatisation domestique, le contrôle industriel ou d'autres domaines pour construire rapidement des flux de traitement de données. Les fonctionnalités principales incluent un éditeur de flux low-code et une gestion robuste des données. Construit sur…
version: 4.1.10
architectures:
- amd64
- arm64
containers:
- name: node-red
  image: nodered/node-red:4.1.10@sha256:eaa2fa23f751581162a4ff9eebb28fcbfcca7935b1a839f63672718f3c816761
  ports:
  - container: 1880
    protocol: tcp
    proxy: false
  volumes:
  - name: data
    target: /data
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: true
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data
migrations: []
releaseNotes:
  en: Node-RED 4.1.10 is a maintenance release. - It fixes module name validation for uninstall and tgz install operations. - It also ensures project files stay inside the project root path.
  fr: Node-RED 4.1.10 is a maintenance release. - It fixes module name validation for uninstall and tgz install operations. - It also ensures project files stay inside the project root path.
securityClassification: critical
