schemaVersion: '1'
id: stremio
name:
  en: Stremio
  fr: Stremio
description:
  en: Stremio offers a secure, modern and seamless entertainment experience. With its easy-to-use interface and diverse content library, including 4K HDR support, users can enjoy their favorite movies and TV shows across all their devices. And with its commitment to security, Stremio is the ultimate choice for a worry-free, high-quality streaming experience.
  fr: Application Stremio auto-hébergée issue du catalogue officiel CasaOS.
version: 1.3.4
architectures:
- amd64
- arm64
containers:
- name: stremio
  image: tsaridas/stremio-docker:v1.3.4@sha256:89d4a95d8df58765caea6c2ca7a762a5e33eea16b4580120e14531e40f7df918
  environment:
    NO_CORS: '1'
    AUTO_SERVER_URL: '1'
  ports:
  - container: 11470
    protocol: tcp
    proxy: true
  - container: 8080
    protocol: tcp
    proxy: false
  volumes:
  - name: config
    target: /root/.stremio-server
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices:
  - /dev/dri
backup:
  mode: crash-consistent
  paths:
  - /root/.stremio-server
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v1.3.4 refreshes the Stremio Docker image from the upstream release stream. - Uses Stremio Web v5.0.0-beta.37. - Uses the desktop server script URL for server v4.20.16.
  fr: '- v1.3.4 refreshes the Stremio Docker image from the upstream release stream. - Uses Stremio Web v5.0.0-beta.37. - Uses the desktop server script URL for server v4.20.16.'
securityClassification: critical
