releaseNotes:
  en: v2rayA v2.2.7.5 fixes Trojan gRPC parameter handling. - Corrects LRU cache list operations. - Adds XHTTP support powered by Xray.
  fr: v2rayA v2.2.7.5 fixes Trojan gRPC parameter handling. - Corrects LRU cache list operations. - Adds XHTTP support powered by Xray.
