schemaVersion: '1'
id: v2raya
name:
  en: V2rayA
  fr: V2rayA
description:
  en: v2rayA is a V2Ray client supporting global transparent proxy, compatible with SS, SSR, Trojan (trojan-go), Tuic, and Juicity protocols. Designed for simplicity, it meets most user needs, ideal for scenarios requiring efficient proxy services. Core features include global transparent proxy and multi-outbound load balancing with traffic splitting. It provides proxy services for nearly all applications without requiring application-specific proxy support. Support for creating and connecting multiple outbound nodes…
  fr: v2rayA est un client V2Ray supportant proxy transparent global, compatible avec les protocoles SS, SSR, Trojan (trojan-go), Tuic et Juicity. Conçu pour la simplicité, il répond à la plupart des besoins des utilisateurs, idéal pour les scénarios nécessitant des services proxy efficaces. Les fonctionnalités principales incluent proxy transparent global et équilibrage de charge multi-sortie avec répartition du trafic. Il fournit des services proxy pour presque toutes les applications sans nécessiter de support proxy…
version: 2.2.7-5
