schemaVersion: '1'
id: autobrr
name:
  en: Autobrr
  fr: Autobrr
description:
  en: Autobrr is the modern download automation tool for torrents and usenet. With inspiration and ideas from tools like trackarr, autodl-irssi and flexget we built one tool that can do it all, and then some.
  fr: Application Autobrr auto-hébergée prête à installer sur Menhir OS.
version: 1.79.0
architectures:
- amd64
- arm64
containers:
- name: autobrr
  image: ghcr.io/autobrr/autobrr:v1.79.0@sha256:5b8c29a86598907496af01ec75ef21f9c0e4e28ce9d6ae6496ef91c71543ec20
  environment:
    TZ: Etc/UTC
  ports:
  - container: 7474
    protocol: tcp
    proxy: true
  volumes:
  - name: config
    target: /config
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /config
migrations: []
releaseNotes:
  en: v1.79.0 adds indexer updates including Nexum freeleech support and Ultrabits. - Includes notification and action workflow improvements from the upstream changelog. - Includes bug fixes and dependency maintenance across the Autobrr release.
  fr: v1.79.0 adds indexer updates including Nexum freeleech support and Ultrabits. - Includes notification and action workflow improvements from the upstream changelog. - Includes bug fixes and dependency maintenance across the Autobrr release.
securityClassification: standard
