schemaVersion: '1'
id: docmost
name:
  en: Docmost
  fr: Docmost
description:
  en: Docmost is a self-hosted collaborative wiki and documentation tool designed for real-time collaboration, allowing multiple users to edit the same page simultaneously without conflicts. Its intuitive interface is ideal for teams managing knowledge bases, project documentation, or wikis, offering an efficient knowledge creation and sharing experience. The tool's core features include real-time collaborative editing and space organization. It supports multiple users editing pages in real time for seamless…
  fr: Docmost est un outil de wiki et de documentation collaboratif auto-hébergé conçu pour la collaboration en temps réel, permettant à plusieurs utilisateurs de modifier la même page simultanément sans conflits. Son interface intuitive est idéale pour les équipes gérant des bases de connaissances, de la documentation de projet ou des wikis, offrant une expérience efficace de création et de partage de connaissances. Les fonctionnalités principales de l'outil incluent l'édition collaborative en temps réel et…
version: 0.90.0
architectures:
- amd64
- arm64
containers:
- name: docmost-db
  image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
  environment:
    POSTGRES_DB: docmost
    POSTGRES_USER: docmost
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
  volumes:
  - name: pgdata
    target: /var/lib/postgresql/data
    type: app
- name: docmost-redis
  image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
  volumes:
  - name: redis
    target: /data
    type: app
- name: docmost
  image: docmost/docmost:0.90.0@sha256:3be8d60d9d5fb84738d2eca5616646e4ee8fd3df8c3524c74ed1050089391afc
  environment:
    APP_URL: http://localhost:3000
    APP_SECRET: ${secret:APP_SECRET}
    DATABASE_URL: postgresql://docmost:${secret:POSTGRES_PASSWORD}@docmost-db:5432/docmost?schema=public
    REDIS_URL: redis://docmost-redis:6379
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: storage
    target: /app/data/storage
    type: app
resources:
  memoryMinimum: 512M
  memoryRecommended: 1G
  cpuRecommended: 2
secrets:
- name: POSTGRES_PASSWORD
  label:
    en: Postgres Password
    fr: Postgres Password
  description:
    en: Secret generated securely for docmost.
    fr: Secret généré de façon sécurisée pour docmost.
  required: true
  generate: true
- name: APP_SECRET
  label:
    en: App Secret
    fr: App Secret
  description:
    en: Secret generated securely for docmost.
    fr: Secret généré de façon sécurisée pour docmost.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /app/data/storage
  - /data
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v0.90.0 adds page labels, synced blocks, indents, table sorting, backlinks, Azure Storage Blobs support, and accessibility fixes. - It includes fixes for editor toolbar preference, page permissions, PDF uploads, macOS Ctrl-K behavior, and table width preservation. - Enterprise additions include templates, PDF import, and SCIM provisioning.
  fr: '- v0.90.0 adds page labels, synced blocks, indents, table sorting, backlinks, Azure Storage Blobs support, and accessibility fixes. - It includes fixes for editor toolbar preference, page permissions, PDF uploads, macOS Ctrl-K behavior, and table width preservation. - Enterprise additions include templates, PDF import, and SCIM provisioning.'
securityClassification: standard
