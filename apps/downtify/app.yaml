schemaVersion: '1'
id: downtify
name:
  en: Downtify
  fr: Downtify
description:
  en: With Downtify you can download Spotify musics containing album art, track names, album title and other metadata about the songs. Just copy the Spotify link, whether it's a single song, an album, etc. As soon as your downloads are complete you will be notified!
  fr: Application Downtify auto-hébergée issue du catalogue officiel CasaOS.
version: 2.7.0
architectures:
- amd64
- arm64
containers:
- name: downtify
  image: ghcr.io/henriquesebastiao/downtify:2.7.0@sha256:95d00787cfcd645ce8e48aead56b6a6b96c6f85646c14d8f7a6491f1a03e0cbc
  environment:
    PGID: '1000'
    PUID: '1000'
    TZ: Etc/UTC
  ports:
  - container: 8000
    protocol: tcp
    proxy: true
  volumes:
  - name: downtify
    target: /downloads
    type: share
  - name: data
    target: /data
    type: app
resources:
  memoryMinimum: 2G
  memoryRecommended: 4G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - v2.7.0 adds configurable parallel downloads. - It adds weekly and monthly playlist synchronization intervals. - Dependency maintenance updates are included.
  fr: '- v2.7.0 adds configurable parallel downloads. - It adds weekly and monthly playlist synchronization intervals. - Dependency maintenance updates are included.'
securityClassification: standard
