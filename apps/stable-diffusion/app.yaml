schemaVersion: '1'
id: stable-diffusion
name:
  en: Stable Diffusion
  fr: Stable Diffusion
description:
  en: Stable Diffusion is a deep learning, text-to-image model released in 2022 based on diffusion techniques. It is primarily used to generate detailed images conditioned on text descriptions, though it can also be applied to other tasks such as inpainting, outpainting, and generating image-to-image translations guided by a text prompt.
  fr: Application Stable Diffusion auto-hébergée issue du catalogue officiel CasaOS.
version: 9.0.0
architectures:
- amd64
containers:
- name: icewhale-stable-diffusion-webui
  image: johnguan/stable-diffusion-webui:latest@sha256:9f147d4995464dda8c9e625be91e21ce553d1617e95cb0ebcf23be40e840063b
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    CPU_FALLBACK: 'true'
  ports:
  - container: 7860
    protocol: tcp
    proxy: true
  volumes:
  - name: models
    target: /data/models
    type: app
  - name: outputs
    target: /data/outputs
    type: app
  - name: config
    target: /data/config
    type: app
resources:
  memoryMinimum: 1G
  memoryRecommended: 2G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data/config
  - /data/models
  - /data/outputs
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog at revision e717df5e312d.
  fr: Importation depuis le catalogue officiel CasaOS à la révision e717df5e312d.
securityClassification: standard
