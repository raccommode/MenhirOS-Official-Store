schemaVersion: '1'
id: linkwarden
name:
  en: Linkwarden
  fr: Linkwarden
description:
  en: Linkwarden is an open-source self-hosted bookmark and web archive manager designed to help users collect, organize, and preserve important online content in one place. In addition to traditional bookmarking capabilities, it provides full webpage backup so valuable information remains safely accessible over time. Built around long-term content preservation, Linkwarden can automatically capture webpage screenshots, PDFs, and full HTML files to help prevent link rot. It also includes reading mode, annotations, local…
  fr: Linkwarden est une plateforme open source auto-hébergée de gestion de favoris et d’archivage web, conçue pour aider les utilisateurs à collecter, organiser et conserver durablement les contenus importants du Web. Au-delà des fonctions classiques de favoris, elle permet de sauvegarder intégralement les pages afin de garder les informations précieuses accessibles dans le temps. Axé sur la préservation à long terme du contenu, Linkwarden peut capturer automatiquement des captures d’écran de pages, des PDF et des…
version: 2.14.1
architectures:
- amd64
- arm64
containers:
- name: linkwarden-postgres
  image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: abc123
    POSTGRES_DB: linkwarden
    TZ: Etc/UTC
  volumes:
  - name: pgdata
    target: /var/lib/postgresql/data
    type: app
  healthcheck:
    test:
    - CMD-SHELL
    - pg_isready -U postgres -d linkwarden
    interval: 10s
    timeout: 5s
    retries: 10
- name: linkwarden-meilisearch
  image: getmeili/meilisearch:v1.12.8@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
  environment:
    MEILI_MASTER_KEY: kZWvi7wFylRjEnOTnNrNucG3d7c892HlIBtN3Vr8M-0
    MEILI_ENV: production
  volumes:
  - name: meili-data
    target: /meili_data
    type: app
- name: linkwarden
  image: ghcr.io/linkwarden/linkwarden:v2.14.1@sha256:31cf4bd2a2e111991fa5c9de03174c8698869c83722105c6ce529e4c911e6861
  environment:
    TZ: Etc/UTC
    NEXTAUTH_URL: http://localhost:3000/api/v1/auth
    NEXTAUTH_SECRET: abc123
    DATABASE_URL: postgresql://postgres:abc123@linkwarden-postgres:5432/linkwarden
    STORAGE_FOLDER: /data
    MEILI_HOST: http://linkwarden-meilisearch:7700
    MEILI_MASTER_KEY: kZWvi7wFylRjEnOTnNrNucG3d7c892HlIBtN3Vr8M-0
    NEXT_PUBLIC_DISABLE_REGISTRATION: 'false'
    NEXT_PUBLIC_CREDENTIALS_ENABLED: 'true'
  ports:
  - container: 3000
    protocol: tcp
    proxy: true
  volumes:
  - name: data
    target: /data/data
    type: app
resources:
  memoryMinimum: 1G
  memoryRecommended: 2G
  cpuRecommended: 2
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /data/data
  - /meili_data
  - /var/lib/postgresql/data
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog. - Linkwarden 2.14.1 adds support for serving preserved HTML archives from a separate public hostname to isolate untrusted content from the main app. - It improves the tag selection experience. - The release also includes stability fixes and bug fixes.
  fr: '- Linkwarden 2.14.1 ajoute la prise en charge de preserved HTML archives depuis un public hostname separe afin d''isoler le contenu non fiable de l''application principale. - L''experience tag selection a ete amelioree. - Cette version inclut aussi des correctifs de stabilite et des corrections de bugs.'
securityClassification: standard
