schemaVersion: '1'
id: firefly
name:
  en: Firefly
  fr: Firefly
description:
  en: Firefly is a simple and easy to install WireGuard server software, which can be widely used in scenarios such as remote networking, remote work, and expose a local server behind a NAT or firewall to the internet. 🎯 Features 🟢 Provide a simple and easy-to-use web management UI 🟣 Supports access to all WireGuard clients 🟡 No need for system installation of WireGuard components 🟠 Single file, no additional library dependencies 🔴 Automatically apply for free SSL certificate
  fr: Application Firefly auto-hébergée issue du catalogue officiel CasaOS.
version: 0.0.1
architectures:
- amd64
- arm64
containers:
- name: firefly
  image: uusec/firefly:latest@sha256:6d32aa84560ba81786d708b7c67b2f20c8321caf1bb164156335ccd1765c87d4
  environment:
    FIREFLY_PASSWORD: ${secret:FIREFLY_PASSWORD}
  volumes:
  - name: conf
    target: /firefly/conf
    type: app
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets:
- name: FIREFLY_PASSWORD
  label:
    en: Firefly Password
    fr: Firefly Password
  description:
    en: Secret generated securely for firefly.
    fr: Secret généré de façon sécurisée pour firefly.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: true
  capabilities:
  - NET_ADMIN
  - SYS_MODULE
  devices:
  - /dev/net/tun
backup:
  mode: crash-consistent
  paths:
  - /firefly/conf
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog at revision e717df5e312d.
  fr: Importation depuis le catalogue officiel CasaOS à la révision e717df5e312d.
securityClassification: critical
