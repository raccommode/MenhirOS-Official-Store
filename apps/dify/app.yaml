schemaVersion: '1'
id: dify
name:
  en: Dify
  fr: Dify
description:
  en: Dify is an open-source large language model (LLM) application development platform. It combines the concepts of Backend-as-a-Service and LLMOps to enable developers to quickly build production-grade generative AI applications. Even non-technical personnel can participate in the definition and data operations of AI applications.
  fr: Application Dify auto-hébergée prête à installer sur Menhir OS.
icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Dify/icon.svg
version: 0.15.8
architectures:
- amd64
containers:
- name: config
  image: ns2kracy/dify-config:latest@sha256:668eb78b044b4382b6b49f667a27b312941890218005807818cfecc4ecbf27a9
  volumes:
  - name: nginx
    target: /configs/nginx
    type: app
  - name: ssrf-proxy
    target: /configs/ssrf_proxy
    type: app
  - name: sandbox
    target: /configs/sandbox
    type: app
- name: db
  image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
  command:
  - postgres
  - -c
  - max_connections=100
  - -c
  - shared_buffers=128MB
  - -c
  - work_mem=4MB
  - -c
  - maintenance_work_mem=64MB
  - -c
  - effective_cache_size=4096MB
  environment:
    PGUSER: postgres
    POSTGRES_PASSWORD: ${secret:POSTGRES_PASSWORD}
    POSTGRES_DB: dify
    PGDATA: /var/lib/postgresql/data/pgdata
  volumes:
  - name: data
    target: /var/lib/postgresql/data
    type: app
  healthcheck:
    test:
    - CMD
    - pg_isready
    interval: 1s
    timeout: 3s
    retries: 30
- name: redis
  image: redis:6-alpine@sha256:ec5e187c913d422cdf60f4216a5fdfb95246792c6de6fe21ff5bed75cbfc8c23
  command:
  - redis-server
  - --requirepass
  - ${secret:POSTGRES_PASSWORD}
  environment:
    REDISCLI_AUTH: ${secret:POSTGRES_PASSWORD}
  volumes:
  - name: data
    target: /data
    type: app
  healthcheck:
    test:
    - CMD
    - redis-cli
    - ping
    interval: 30s
    timeout: 10s
    retries: 3
- name: api
  image: langgenius/dify-api:0.15.8@sha256:a6ed75b1a9c08b1997b9e6282930b819c4d0b3e150b705a0133a531d7475a3e4
  environment:
    MODE: api
    LOG_LEVEL: INFO
    SECRET_KEY: ${secret:SECRET_KEY}
    CONSOLE_WEB_URL: ''
    INIT_PASSWORD: ''
    CONSOLE_API_URL: ''
    SERVICE_API_URL: ''
    APP_WEB_URL: ''
    FILES_URL: ''
    FILES_ACCESS_TIMEOUT: '300'
    MIGRATION_ENABLED: 'true'
    DB_USERNAME: postgres
    DB_PASSWORD: ${secret:POSTGRES_PASSWORD}
    DB_HOST: db
    DB_PORT: '5432'
    DB_DATABASE: dify
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_PASSWORD: ${secret:POSTGRES_PASSWORD}
    REDIS_DB: '0'
    CELERY_BROKER_URL: redis://:${secret:POSTGRES_PASSWORD}@redis:6379/1
    WEB_API_CORS_ALLOW_ORIGINS: '*'
    CONSOLE_CORS_ALLOW_ORIGINS: '*'
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: storage
    VECTOR_STORE: weaviate
    WEAVIATE_ENDPOINT: http://weaviate:8080
    WEAVIATE_API_KEY: ${secret:WEAVIATE_API_KEY}
    CODE_EXECUTION_ENDPOINT: http://sandbox:8194
    CODE_EXECUTION_API_KEY: ${secret:CODE_EXECUTION_API_KEY}
    CODE_MAX_NUMBER: '9223372036854775807'
    CODE_MIN_NUMBER: '-9223372036854775808'
    CODE_MAX_STRING_LENGTH: '80000'
    TEMPLATE_TRANSFORM_MAX_LENGTH: '80000'
    CODE_MAX_STRING_ARRAY_LENGTH: '30'
    CODE_MAX_OBJECT_ARRAY_LENGTH: '30'
    CODE_MAX_NUMBER_ARRAY_LENGTH: '1000'
    SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
    SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
    INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: '1000'
  volumes:
  - name: storage
    target: /app/api/storage
    type: app
- name: worker
  image: langgenius/dify-api:0.15.8@sha256:a6ed75b1a9c08b1997b9e6282930b819c4d0b3e150b705a0133a531d7475a3e4
  environment:
    MODE: worker
    LOG_LEVEL: INFO
    SECRET_KEY: ${secret:SECRET_KEY}
    DB_USERNAME: postgres
    DB_PASSWORD: ${secret:POSTGRES_PASSWORD}
    DB_HOST: db
    DB_PORT: '5432'
    DB_DATABASE: dify
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_PASSWORD: ${secret:POSTGRES_PASSWORD}
    REDIS_DB: '0'
    REDIS_USE_SSL: 'false'
    CELERY_BROKER_URL: redis://:${secret:POSTGRES_PASSWORD}@redis:6379/1
    STORAGE_TYPE: local
    STORAGE_LOCAL_PATH: storage
    VECTOR_STORE: weaviate
    WEAVIATE_ENDPOINT: http://weaviate:8080
    WEAVIATE_API_KEY: ${secret:WEAVIATE_API_KEY}
  volumes:
  - name: storage
    target: /app/api/storage
    type: app
- name: web
  image: langgenius/dify-web:0.15.8@sha256:3ccefa505a2756a4e89f210d3b9f9a95d66750c1e76f63e13757818eaf675354
  environment:
    CONSOLE_API_URL: ''
    APP_API_URL: ''
- name: weaviate
  image: semitechnologies/weaviate:1.19.0@sha256:17a5238fcfc31d50427bb0e8338f01c3a0d62e27fbe3b6a9a6832b6e43b638bf
  environment:
    QUERY_DEFAULTS_LIMIT: '25'
    AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
    PERSISTENCE_DATA_PATH: /var/lib/weaviate
    DEFAULT_VECTORIZER_MODULE: none
    CLUSTER_HOSTNAME: node1
    AUTHENTICATION_APIKEY_ENABLED: 'true'
    AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${secret:WEAVIATE_API_KEY}
    AUTHENTICATION_APIKEY_USERS: hello@dify.ai
    AUTHORIZATION_ADMINLIST_ENABLED: 'true'
    AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
  volumes:
  - name: weaviate
    target: /var/lib/weaviate
    type: app
- name: sandbox
  image: langgenius/dify-sandbox:0.2.11@sha256:9692656f31212a54f4f275e55d5b49f656357649aeed383e7397877d13854a2e
  environment:
    API_KEY: ${secret:CODE_EXECUTION_API_KEY}
    GIN_MODE: release
    WORKER_TIMEOUT: '15'
    ENABLE_NETWORK: 'true'
    HTTP_PROXY: http://ssrf_proxy:3128
    HTTPS_PROXY: http://ssrf_proxy:3128
    SANDBOX_PORT: '8194'
  volumes:
  - name: dependencies
    target: /dependencies
    type: app
- name: ssrf_proxy
  image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
  environment:
    HTTP_PORT: '3128'
    COREDUMP_DIR: /var/spool/squid
    REVERSE_PROXY_PORT: '8194'
    SANDBOX_HOST: sandbox
    SANDBOX_PORT: '8194'
  volumes:
  - name: ssrf-proxy
    target: /etc/squid
    type: app
- name: nginx
  image: nginx:latest@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
  ports:
  - container: 80
    protocol: tcp
    proxy: true
  volumes:
  - name: nginx
    target: /etc/nginx
    type: app
resources:
  memoryMinimum: 2G
  memoryRecommended: 4G
  cpuRecommended: 2
secrets:
- name: POSTGRES_PASSWORD
  label:
    en: Postgres Password
    fr: Postgres Password
  description:
    en: Secret generated securely for dify.
    fr: Secret généré de façon sécurisée pour dify.
  required: true
  generate: true
- name: SECRET_KEY
  label:
    en: Secret Key
    fr: Secret Key
  description:
    en: Secret generated securely for dify.
    fr: Secret généré de façon sécurisée pour dify.
  required: true
  generate: true
- name: WEAVIATE_API_KEY
  label:
    en: Weaviate Api Key
    fr: Weaviate Api Key
  description:
    en: Secret generated securely for dify.
    fr: Secret généré de façon sécurisée pour dify.
  required: true
  generate: true
- name: CODE_EXECUTION_API_KEY
  label:
    en: Code Execution Api Key
    fr: Code Execution Api Key
  description:
    en: Secret generated securely for dify.
    fr: Secret généré de façon sécurisée pour dify.
  required: true
  generate: true
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths:
  - /app/api/storage
  - /configs/nginx
  - /configs/sandbox
  - /configs/ssrf_proxy
  - /data
  - /dependencies
  - /etc/nginx
  - /etc/squid
  - /var/lib/postgresql/data
  - /var/lib/weaviate
migrations: []
releaseNotes:
  en: The 0.15.8 Git tag and Docker images were published without a matching GitHub Release object. - The API, worker, and web images are updated together to 0.15.8; the sandbox image is aligned to the 0.15.8 compose baseline. - Back up Dify data before upgrading and validate the Web UI after the service finishes migrations.
  fr: The 0.15.8 Git tag and Docker images were published without a matching GitHub Release object. - The API, worker, and web images are updated together to 0.15.8; the sandbox image is aligned to the 0.15.8 compose baseline. - Back up Dify data before upgrading and validate the Web UI after the service finishes migrations.
securityClassification: standard
