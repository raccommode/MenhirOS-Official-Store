schemaVersion: '1'
id: mineos
name:
  en: MineOS
  fr: MineOS
description:
  en: MineOS is a server front-end to ease managing Minecraft administrative tasks. This iteration using Node.js aims to enhance previous MineOS scripts (Python-based), by leveraging the event-triggering, asyncronous model of Node.JS and websockets.
  fr: MineOS est une interface de serveur pour faciliter la gestion des tâches administratives de Minecraft. Cette itération utilisant Node.js vise à améliorer les scripts MineOS précédents (basés sur Python), en tirant parti du modèle asynchrone de déclenchement d'événements de Node.JS et des websockets.
version: 1.2.2
architectures:
- amd64
containers:
- name: mineos
  image: hexparrot/mineos:latest@sha256:247be835fbdc48932e92dc3dee9e2a9fcee5fa877ce5cbb0edf7abda6f0323f5
  environment:
    USE_HTTPS: 'true'
    SERVER_PORT: '8443'
    USER_NAME: mc
    USER_UID: '1000'
    USER_PASSWORD: root
  ports:
  - container: 8443
    protocol: tcp
    proxy: true
resources:
  memoryMinimum: 256M
  memoryRecommended: 512M
  cpuRecommended: 1
secrets: []
permissions:
  privileged: false
  hostNetwork: false
  capabilities: []
  devices: []
backup:
  mode: crash-consistent
  paths: []
migrations: []
releaseNotes:
  en: Imported from the official CasaOS catalog at revision e717df5e312d.
  fr: Importation depuis le catalogue officiel CasaOS à la révision e717df5e312d.
securityClassification: standard
